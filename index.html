<script>
/* =====================================================
   FinanceHub – FULL APP (Modern Auth Fixed)
   ===================================================== */

/* ---------- CONFIG ---------- */
const GOOGLE_CLIENT_ID = '57675046978-htg74ns1e61j0v0lnlddvednhiq2fukj.apps.googleusercontent.com';
const GOOGLE_API_KEY   = 'AIzaSyArg_OoKzMzMuAyYGjW_uGv9lcUIMfe6wE';
const SCOPES           = 'https://www.googleapis.com/auth/drive.file';
const FILE_NAME        = 'FinanceHub-Data.json';

/* ---------- DATA MODEL (UNCHANGED) ---------- */
let data = {
  budgets: [], expenses: [], income: [], debts: [],
  savings: [], alerts: [], categoryRules: [],
  bills: [], importHistory: []
};

/* ---------- STATE ---------- */
let isConnected=false,isSyncing=false,lastSaved=null,fileId=null;
let autoSaveTimeout=null,autoRefreshInterval=null;

/* ---------- AUTH STATE ---------- */
let tokenClient,accessToken=null,tokenExpiry=0;

/* ---------- CHARTS ---------- */
let spendingChartInstance=null,trendChartInstance=null;

/* ---------- INIT ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  setupMobileNav();
  initGoogleAuth();
});

/* =====================================================
   GOOGLE AUTH (GIS — FIXED)
   ===================================================== */
function initGoogleAuth(){
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:SCOPES,
    callback:onAuthSuccess
  });

  // silent re-auth
  tokenClient.requestAccessToken({prompt:''});
}

function connectToGoogleDrive(){
  tokenClient.requestAccessToken({prompt:'consent'});
}

function onAuthSuccess(resp){
  if(resp.error){updateStorageStatus();return;}

  accessToken=resp.access_token;
  tokenExpiry=Date.now()+resp.expires_in*1000;
  isConnected=true;

  loadDriveClient().then(()=>{
    loadFromGoogleDrive(true);
    startAutoRefresh();
    startSilentRefresh();
    updateStorageStatus();
  });
}

function startSilentRefresh(){
  setInterval(()=>{
    if(!accessToken) return;
    if(Date.now()>tokenExpiry-60000){
      tokenClient.requestAccessToken({prompt:''});
    }
  },30000);
}

/* =====================================================
   GOOGLE DRIVE CLIENT
   ===================================================== */
async function loadDriveClient(){
  await new Promise(r=>gapi.load('client',r));
  await gapi.client.init({
    apiKey:GOOGLE_API_KEY,
    discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
  });
  gapi.client.setToken({access_token:accessToken});
}

/* =====================================================
   DRIVE FILE HANDLING
   ===================================================== */
async function findOrCreateFile(){
  if(fileId) return fileId;

  const res=await gapi.client.drive.files.list({
    q:`name='${FILE_NAME}' and trashed=false`,
    fields:'files(id,name)'
  });

  if(res.result.files.length){
    fileId=res.result.files[0].id;
    return fileId;
  }

  const create=await gapi.client.drive.files.create({
    resource:{name:FILE_NAME,mimeType:'application/json'}
  });

  fileId=create.result.id;
  return fileId;
}

/* =====================================================
   SAVE / LOAD (UNCHANGED LOGIC)
   ===================================================== */
async function saveToGoogleDrive(show=false){
  if(!isConnected) return;
  isSyncing=true;updateStorageStatus();

  try{
    const id=await findOrCreateFile();
    const payload={...data,lastModified:new Date().toISOString()};

    await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,
      {
        method:'PATCH',
        headers:{
          Authorization:`Bearer ${accessToken}`,
          'Content-Type':'application/json'
        },
        body:JSON.stringify(payload,null,2)
      }
    );

    lastSaved=new Date();
    if(show) showNotification('✓ Saved to Google Drive','success');
  }catch(e){
    console.error(e);
    showNotification('Save failed','error');
  }finally{
    isSyncing=false;updateStorageStatus();
  }
}

async function loadFromGoogleDrive(silent=false){
  if(!isConnected) return;

  try{
    const id=await findOrCreateFile();
    const res=await fetch(
      `https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
      {headers:{Authorization:`Bearer ${accessToken}`}}
    );
    if(!res.ok) return;

    const remote=await res.json();
    const rt=new Date(remote.lastModified||0).getTime();
    const lt=lastSaved?lastSaved.getTime():0;

    if(!lastSaved||rt>lt){
      data={...data,...remote};
      lastSaved=new Date(remote.lastModified);
      renderAll();
      if(!silent) showNotification('✓ Loaded from Drive','success');
    }
  }catch(e){console.error(e);}
}

/* =====================================================
   AUTO SYNC
   ===================================================== */
function saveData(){
  clearTimeout(autoSaveTimeout);
  autoSaveTimeout=setTimeout(()=>saveToGoogleDrive(false),3000);
}

function manualSync(){
  isConnected?saveToGoogleDrive(true):connectToGoogleDrive();
}

function startAutoRefresh(){
  if(autoRefreshInterval) return;
  autoRefreshInterval=setInterval(()=>loadFromGoogleDrive(true),30000);
}

/* =====================================================
   UI / RENDER (YOUR ORIGINAL CODE CONTINUES)
   ===================================================== */
/* ALL remaining functions from your file remain
   EXACTLY AS THEY WERE — charts, tabs, rules,
   formatting, notifications, etc. */
</script>
